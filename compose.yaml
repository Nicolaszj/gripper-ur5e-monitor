name: maximiliano-estudiante
services:
  influxdb:
    image: influxdb:2.7.12
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${ADMIN_USER:-maximiliano}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${ADMIN_PASSWORD:?Ejecuta python scripts/manage.py init}
      DOCKER_INFLUXDB_INIT_ORG: maximiliano-estudiante
      DOCKER_INFLUXDB_INIT_BUCKET: gripper
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?Falta INFLUX_TOKEN}
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influx_data:/var/lib/influxdb2
      - influx_config:/etc/influxdb2
    healthcheck:
      test: [CMD, influx, ping, --host, "http://localhost:8086"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  node-red:
    build: ./node-red
    restart: unless-stopped
    environment:
      TZ: America/Bogota
      ADMIN_USER: ${ADMIN_USER:-maximiliano}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: maximiliano-estudiante
      INFLUX_BUCKET: gripper
      INFLUX_URL: http://influxdb:8086
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET}
    ports:
      - "${INGRESS_BIND_IP:-0.0.0.0}:1880:1880"
    volumes:
      - node_red_data:/data
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:1880/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${ADMIN_USER:-maximiliano}
      GF_SECURITY_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/gripper.json
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: maximiliano-estudiante
      INFLUX_BUCKET: gripper
    ports:
      - "${DASHBOARD_BIND_IP:-0.0.0.0}:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  simulador:
    image: python:3.12-alpine
    profiles: [demo]
    restart: unless-stopped
    environment:
      TELEMETRY_URL: http://node-red:1880/api/telemetry
    volumes:
      - ./tools:/app:ro
    working_dir: /app
    command: [python, -u, simulador.py]
    depends_on:
      node-red:
        condition: service_healthy

  serial-bridge:
    image: python:3.12-alpine
    profiles: [serial]
    restart: unless-stopped
    environment:
      TELEMETRY_URL: http://node-red:1880/api/telemetry
    volumes:
      - ./tools:/app:ro
    devices:
      - "${SERIAL_DEVICE:-/dev/ttyUSB0}:/dev/ttyESP"
    working_dir: /app
    command: [python, -u, serial_bridge.py, --puerto, /dev/ttyESP]
    depends_on:
      node-red:
        condition: service_healthy

volumes:
  influx_data:
  influx_config:
  node_red_data:
  grafana_data:
