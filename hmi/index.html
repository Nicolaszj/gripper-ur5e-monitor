<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HMI Gripper UR5e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#111417;--surface:#1a1e22;--surface-2:#22272c;--surface-3:#2c3238;--border:#343b42;--border-strong:#6b7580;--ink:#e8ecef;--ink-2:#aab3bc;--ink-3:#8f99a3;--setpoint:#6fb1ff;--setpoint-soft:#6fb1ff40;--ok:#4fc3b4;--warn:#f2b33d;--warn-soft:#f2b33d33;--danger:#ff6b5e;--danger-soft:#ff6b5e2e;--on-danger:#1a0806;--estop:#d92d20;--on-estop:#ffffff;--estop-collar:#f2c230;--focus:var(--setpoint);--font-sans:"IBM Plex Sans", system-ui, sans-serif;--font-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--radius-sm:2px;--radius-md:4px;--radius-lg:6px;--control-h:40px;--control-h-touch:48px;--estop-h:48px;--track-h:8px;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#eef0f2;--surface:#ffffff;--surface-2:#f5f6f7;--surface-3:#e3e6ea;--border:#d3d8dd;--border-strong:#6f7a85;--ink:#14181c;--ink-2:#48525c;--ink-3:#5a646e;--setpoint:#1257b8;--setpoint-soft:#1257b833;--ok:#0b6e63;--warn:#8a5a00;--warn-soft:#8a5a0029;--danger:#b3261e;--danger-soft:#b3261e1f;--on-danger:#ffffff;--estop:#c4271b;--on-estop:#ffffff;--estop-collar:#f2c230;--focus:var(--setpoint);color-scheme:light}}
:root[data-theme="light"]{--bg:#eef0f2;--surface:#ffffff;--surface-2:#f5f6f7;--surface-3:#e3e6ea;--border:#d3d8dd;--border-strong:#6f7a85;--ink:#14181c;--ink-2:#48525c;--ink-3:#5a646e;--setpoint:#1257b8;--setpoint-soft:#1257b833;--ok:#0b6e63;--warn:#8a5a00;--warn-soft:#8a5a0029;--danger:#b3261e;--danger-soft:#b3261e1f;--on-danger:#ffffff;--estop:#c4271b;--on-estop:#ffffff;--estop-collar:#f2c230;--focus:var(--setpoint);color-scheme:light}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.hmi{container-type:inline-size;font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;text-align:left}
.hmi *,.hmi *::before,.hmi *::after{box-sizing:border-box}
.hmi [hidden]{display:none!important}
.hmi button{font:inherit;color:inherit;margin:0}
.hmi :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hmi-num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:500}
.hmi-label{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0}
.hmi-nota{font-size:12px;line-height:16px;color:var(--ink-3)}
.hmi-unit{font-family:var(--font-sans);font-size:12px;font-weight:400;color:var(--ink-3);margin-left:var(--space-1)}
.hmi-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-4);min-width:0}
.hmi-panel__head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-2);margin-bottom:var(--space-3)}
.hmi-sub{margin-top:var(--space-4);padding-top:var(--space-3);border-top:1px solid var(--border)}
.hmi-sub>.hmi-label{margin-bottom:var(--space-2)}
.hmi-btn{height:var(--control-h);padding:0 var(--space-4);border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface-2);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);white-space:nowrap}
.hmi-btn:hover{background:var(--surface-3)}
.hmi-btn:active{transform:translateY(1px)}
.hmi-btn:disabled{color:var(--ink-3);border-color:var(--border);cursor:not-allowed;background:transparent}
.hmi-btn--sm{height:28px;padding:0 var(--space-3);font-size:12px}
.hmi .hmi-btn--inv{background:var(--on-danger);color:var(--danger);border-color:var(--on-danger)}
.hmi .hmi-btn--inv:hover{background:var(--on-danger);opacity:.9}
.hmi-btn__glyph{width:10px;height:10px;background:currentColor;flex:none}
.hmi-acciones{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2)}
.hmi-seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--border-strong);border-radius:var(--radius-md);overflow:hidden}
.hmi-seg button{height:var(--control-h);border:0;border-left:1px solid var(--border-strong);background:transparent;cursor:pointer;padding:0 var(--space-2);font-size:13px;color:var(--ink-2);white-space:nowrap}
.hmi-seg button:first-child{border-left:0}
.hmi-seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.hmi-seg button:disabled{cursor:not-allowed;opacity:.55}
.hmi-seg button:focus-visible{outline-offset:-3px}
.hmi-campo{display:grid;gap:var(--space-1);margin-top:var(--space-3)}
.hmi-campo>span{font-size:13px;color:var(--ink-2)}
.hmi-estop{height:var(--estop-h);padding:4px;border:0;border-radius:var(--radius-md);background:var(--estop-collar);cursor:pointer;flex:none}
.hmi-estop>span{display:flex;align-items:center;gap:var(--space-2);height:100%;padding:0 var(--space-4);border-radius:var(--radius-sm);background:var(--estop);color:var(--on-estop);font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.hmi-estop>span::before{content:"";width:14px;height:14px;border-radius:50%;border:3px solid var(--on-estop);flex:none}
.hmi-estop[aria-pressed="true"]>span{box-shadow:inset 0 0 0 2px var(--on-estop)}
.hmi-estop:focus-visible{outline-offset:3px}
.hmi-ciclo{list-style:none;margin:0;padding:0;display:flex;gap:var(--space-1);min-width:0}
.hmi-paso{flex:1 1 0;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:6px;align-items:center;padding:6px 6px 9px;border:1px solid var(--border);border-radius:var(--radius-md);position:relative;color:var(--ink-3);background:transparent}
.hmi-paso__n{width:20px;height:20px;border:1px solid currentColor;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;line-height:1}
.hmi-paso__t{display:grid;min-width:0}
.hmi-paso__t b{font-size:13px;line-height:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmi-paso__t i{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:normal;font-family:var(--font-mono);font-size:12px;line-height:16px}
.hmi-paso__bar{position:absolute;left:-1px;right:-1px;bottom:-1px;height:3px;border-radius:0 0 var(--radius-md) var(--radius-md);overflow:hidden}
.hmi-paso__bar i{display:block;height:100%;width:0;background:var(--ok)}
.hmi-paso[data-estado="hecho"]{color:var(--ink-2)}
.hmi-paso[data-estado="hecho"] .hmi-paso__n{background:var(--ink-2);border-color:var(--ink-2);color:var(--surface)}
.hmi-paso[data-estado="activo"]{color:var(--ink);border-color:var(--ink);background:var(--surface-2)}
.hmi-paso[data-estado="activo"] .hmi-paso__n{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.hmi-paso[data-tipo="falla"]{flex:1.25 1 0;margin-left:var(--space-2);border-style:dashed;border-color:var(--border-strong)}
.hmi-paso[data-tipo="falla"] .hmi-paso__n{border-radius:var(--radius-sm)}
.hmi-paso[data-estado="falla"]{background:var(--danger);border-color:var(--danger);border-style:solid;color:var(--on-danger)}
.hmi-paso[data-estado="falla"] .hmi-paso__n{background:var(--on-danger);border-color:var(--on-danger);color:var(--danger);font-weight:700}
.hmi-bin{display:flex;align-items:center;gap:var(--space-2);min-width:0}
.hmi-bin__lamp{width:12px;height:12px;flex:none;border:2px solid var(--border-strong);border-radius:var(--radius-sm);background:transparent}
.hmi-bin__txt{display:grid;min-width:0}
.hmi-bin__label{font-size:12px;line-height:16px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmi-bin__state{font-size:13px;line-height:16px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.hmi-bin[data-estado="on"] .hmi-bin__lamp{background:var(--ok);border-color:var(--ok)}
.hmi-bin[data-estado="on"] .hmi-bin__state{color:var(--ink)}
.hmi-bin[data-estado="aviso"] .hmi-bin__lamp{background:var(--warn);border-color:var(--warn);border-radius:50%}
.hmi-bin[data-estado="aviso"] .hmi-bin__state{color:var(--warn)}
.hmi-bin[data-estado="falla"] .hmi-bin__lamp{background:var(--danger);border-color:var(--danger);transform:rotate(45deg)}
.hmi-bin[data-estado="falla"] .hmi-bin__state{color:var(--danger)}
.hmi-bin--caja{padding:var(--space-2) var(--space-3);background:var(--surface-2);border-radius:var(--radius-md)}
.hmi-bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2)}
.hmi-bins--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.hmi-ctl{display:grid;gap:6px;padding:var(--space-2) 0}
.hmi-ctl+.hmi-ctl{border-top:1px solid var(--border)}
.hmi-ctl__top{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-2)}
.hmi-ctl__label{font-size:14px;line-height:20px;font-weight:500;min-width:0}
.hmi-ctl__label small{display:block;font-size:12px;line-height:16px;font-weight:400;color:var(--ink-3)}
.hmi-ctl__vals{display:flex;gap:var(--space-3);align-items:flex-end;flex:none}
.hmi-ctl__val{display:grid;justify-items:end}
.hmi-ctl__val i{font-style:normal;font-size:12px;line-height:14px;color:var(--ink-3)}
.hmi-ctl__val b{font-family:var(--font-mono);font-weight:500;font-size:14px;line-height:20px;min-width:5ch;text-align:right}
.hmi-ctl__val--sp b{color:var(--setpoint)}
.hmi-ctl__u{font-size:12px;line-height:20px;color:var(--ink-3);min-width:34px}
.hmi-ctl__track{position:relative;height:24px}
.hmi-ctl__track::before{content:"";position:absolute;left:0;right:0;top:8px;height:var(--track-h);background:var(--surface-3);border-radius:var(--radius-sm)}
.hmi-ctl__fill{position:absolute;left:0;top:8px;height:var(--track-h);width:var(--pv,0%);background:var(--ink-2);border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.hmi-ctl__band{position:absolute;top:3px;height:18px;left:var(--b0,0%);width:calc(var(--b1,0%) - var(--b0,0%));background:var(--setpoint-soft);border-left:1px solid var(--setpoint);border-right:1px solid var(--setpoint)}
.hmi-ctl__pvmark{position:absolute;top:4px;height:16px;width:2px;left:var(--pv,0%);margin-left:-1px;background:var(--ink)}
.hmi-ctl__thumb{position:absolute;top:0;left:var(--sp,0%);width:10px;height:24px;margin-left:-5px;background:var(--setpoint);border:2px solid var(--surface);border-radius:var(--radius-sm)}
.hmi-ctl__track input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
.hmi-ctl__track:focus-within .hmi-ctl__thumb{outline:2px solid var(--focus);outline-offset:2px}
.hmi-ctl__scale{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:12px;line-height:16px;color:var(--ink-3)}
.hmi-ctl__state{font-family:var(--font-sans);font-weight:600}
.hmi-ctl__state[data-s="ok"]{color:var(--ok)}
.hmi-ctl__state[data-s="fuera"]{color:var(--warn)}
.hmi-ctl[data-off="true"] .hmi-ctl__thumb{background:var(--border-strong)}
.hmi-ctl[data-off="true"] .hmi-ctl__val--sp b{color:var(--ink-3)}
.hmi-ctl[data-off="true"] input{cursor:not-allowed}
.hmi-ctl--compacto{padding:0;border:0!important}
.hmi-ctl--compacto .hmi-ctl__top{display:grid;justify-content:stretch;gap:2px}
.hmi-ctl--compacto .hmi-ctl__vals{justify-content:space-between;gap:var(--space-1)}
.hmi-ctl--compacto .hmi-ctl__val{justify-items:start}
.hmi-ctl--compacto .hmi-ctl__val b{min-width:0;text-align:left}
.hmi-ctl--compacto .hmi-ctl__u{display:none}
.hmi-trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3);padding:var(--space-2) 0;border-top:1px solid var(--border)}
.hmi-motor{background:var(--surface-2);border-radius:var(--radius-md);padding:var(--space-3);display:grid;gap:var(--space-2);border:1px solid transparent}
.hmi-motor__head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-2)}
.hmi-motor__name{font-size:15px;line-height:20px;font-weight:600}
.hmi-motor__rol{display:block;font-size:12px;line-height:16px;font-weight:400;color:var(--ink-3)}
.hmi-tag{font-size:12px;line-height:16px;font-weight:600;padding:2px var(--space-2);border-radius:var(--radius-sm);border:1px solid var(--border-strong);color:var(--ink-2);white-space:nowrap}
.hmi-tag[data-z="pico"]{border-color:var(--warn);color:var(--warn)}
.hmi-tag[data-z="excede"]{border-color:var(--danger);background:var(--danger);color:var(--on-danger)}
.hmi-tag[data-z="confirmar"]{border-color:var(--warn);color:var(--warn);border-style:dashed}
.hmi-motor__vals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2)}
.hmi-motor__v{display:grid}
.hmi-motor__v i{font-style:normal;font-size:12px;line-height:16px;color:var(--ink-3)}
.hmi-motor__v b{font-family:var(--font-mono);font-weight:500;font-size:20px;line-height:24px;white-space:nowrap}
.hmi-gauge{position:relative;height:var(--track-h);border-radius:var(--radius-sm);overflow:hidden;background:linear-gradient(to right,var(--surface-3) 0 var(--zc),var(--warn-soft) var(--zc) var(--zs),var(--danger-soft) var(--zs) 100%)}
.hmi-gauge__fill{position:absolute;left:0;top:0;bottom:0;width:var(--pv,0%);background:var(--ink-2)}
.hmi-gauge__tick{position:absolute;top:0;bottom:0;width:1px;background:var(--border-strong)}
.hmi-motor[data-zona="pico"] .hmi-gauge__fill{background:var(--warn)}
.hmi-motor[data-zona="excede"] .hmi-gauge__fill{background:var(--danger)}
.hmi-motor[data-zona="excede"]{border-color:var(--danger)}
.hmi-gauge__esc{position:relative;height:16px;font-family:var(--font-mono);font-size:12px;line-height:16px;color:var(--ink-3)}
.hmi-gauge__esc span{position:absolute;top:0;white-space:nowrap}
.hmi-motor__disparo{font-size:12px;line-height:16px;color:var(--danger);font-weight:600}
.hmi-alarmas{display:grid}
.hmi-alarma{display:grid;grid-template-columns:20px minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,.9fr) 96px 72px 92px;align-items:center;column-gap:var(--space-3);min-height:40px;padding:6px var(--space-2);border-top:1px solid var(--border)}
.hmi-alarma__ico{width:14px;height:14px;position:relative;justify-self:center}
.hmi-alarma__ico::before{content:"";position:absolute;left:1px;right:1px;top:6px;height:2px;background:var(--border-strong)}
.hmi-alarma[data-estado="activa"] .hmi-alarma__ico::before,.hmi-alarma[data-estado="reconocida"] .hmi-alarma__ico::before{left:0;right:0;top:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:13px solid var(--danger);background:none}
.hmi-alarma[data-estado="reconocida"] .hmi-alarma__ico::before{border-bottom-color:var(--warn)}
.hmi-alarma__nombre{font-weight:600}
.hmi-alarma__cond{font-size:12px;line-height:16px;color:var(--ink-3)}
.hmi-alarma__valor{font-family:var(--font-mono);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmi-alarma__estado{font-size:13px;font-weight:600;color:var(--ink-2)}
.hmi-alarma__hora{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.hmi-alarma[data-estado="activa"]{background:var(--danger-soft)}
.hmi-alarma[data-estado="activa"] .hmi-alarma__estado{color:var(--danger)}
.hmi-alarma[data-estado="reconocida"] .hmi-alarma__estado{color:var(--warn)}
.hmi-alarma__accion{justify-self:end}
.hmi-lect{display:grid;gap:2px;min-width:0}
.hmi-lect__v{font-family:var(--font-mono);font-weight:500;font-size:32px;line-height:36px;white-space:nowrap}
.hmi-lect__v--lg{font-size:20px;line-height:24px}
.hmi-lect__v .hmi-unit{font-size:14px}
.hmi-par{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.hmi-caja{background:var(--surface-2);border-radius:var(--radius-md);padding:var(--space-3);min-width:0}
.hmi-meter{position:relative;height:var(--track-h);background:var(--surface-3);border-radius:var(--radius-sm);margin-top:var(--space-2)}
.hmi-meter i{position:absolute;left:0;top:0;bottom:0;width:var(--pv,0%);background:var(--ink-2);border-radius:var(--radius-sm)}
.hmi-meter[data-s="fuera"] i{background:var(--danger)}
.hmi-meter b{position:absolute;top:-4px;bottom:-4px;width:2px;left:var(--lim,80%);background:var(--ink)}
.hmi-gripper{display:grid;grid-template-columns:minmax(0,264px) minmax(0,1fr);gap:var(--space-4);align-items:start}
.hmi-esq{width:100%;height:auto;display:block;background:var(--surface-2);border-radius:var(--radius-md)}
.hmi-esq text{font-family:var(--font-sans);font-size:12px;fill:var(--ink-3)}
.hmi-esq .t-num{font-family:var(--font-mono);fill:var(--ink);font-size:13px;font-weight:500}
.hmi-esq .t-dedo{fill:var(--ink);font-weight:600;font-size:13px}
.hmi-esq .palma{fill:var(--surface-3);stroke:var(--border-strong);stroke-width:1.5}
.hmi-esq .brida{fill:none;stroke:var(--border-strong);stroke-width:1.5;stroke-dasharray:4 3}
.hmi-esq .dedo{stroke:var(--ink-2);stroke-width:11;stroke-linecap:round;fill:none}
.hmi-esq .dedo--c{stroke:var(--border-strong)}
.hmi-esq .dedo--off{stroke-dasharray:1 16}
.hmi-esq .junta{fill:var(--surface-2);stroke:var(--ink);stroke-width:2}
.hmi-esq .junta--c{stroke:var(--border-strong)}
.hmi-esq .pieza{fill:var(--setpoint-soft);stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:5 3}
.hmi-esq .cota{stroke:var(--ink);stroke-width:1.5;fill:none}
.hmi-esq .obj{stroke:var(--setpoint);stroke-width:1.5;stroke-dasharray:3 3;fill:none}
.hmi-esq[data-falla="true"] .dedo--falla{stroke:var(--danger)}
.hmi-angs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-2);margin-top:var(--space-2)}
.hmi-angs div{display:grid}
.hmi-angs i{font-style:normal;font-size:12px;line-height:16px;color:var(--ink-3)}
.hmi-angs b{font-family:var(--font-mono);font-weight:500;font-size:14px}
.hmi-trend{display:grid;gap:var(--space-2)}
.hmi-lane{display:grid;grid-template-columns:112px minmax(0,1fr) 34px;gap:var(--space-2);align-items:stretch}
.hmi-lane__id{display:grid;align-content:center}
.hmi-lane__id i{font-style:normal;font-size:12px;line-height:16px;color:var(--ink-3)}
.hmi-lane__id b{font-family:var(--font-mono);font-weight:500;font-size:20px;line-height:24px;white-space:nowrap}
.hmi-lane svg{width:100%;height:72px;display:block;background:var(--surface-2);border-radius:var(--radius-sm)}
.hmi-lane .grid{stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke}
.hmi-lane .pv{fill:none;stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.hmi-lane .sp{fill:none;stroke:var(--setpoint);stroke-width:1.5;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.hmi-lane .band{fill:var(--setpoint-soft)}
.hmi-lane__y{display:flex;flex-direction:column;justify-content:space-between;font-family:var(--font-mono);font-size:12px;line-height:14px;color:var(--ink-3)}
.hmi-trend__x{display:grid;grid-template-columns:112px minmax(0,1fr) 34px;gap:var(--space-2);font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}

      '<div class="hmi-motor"><div class="hmi-motor__vals"><span class="hmi-motor__v"><i>Posición</i><b data-r="axT"></b></span><span class="hmi-motor__v"><i>Ángulo</i><b data-r="axG"></b></span><span class="hmi-motor__v"><i>Velocidad</i><b data-r="axV"></b></span></div>' +
      '<div><div class="hmi-meter mon-meter" data-r="axPos" role="img"><i></i></div><div class="mon-esc"><span>0</span><span>posición · ticks</span><span>1023</span></div></div></div>' +
      '<div class="hmi-motor" style="margin-top:var(--space-2)"><div class="hmi-motor__vals"><span class="hmi-motor__v"><i>Carga</i><b data-r="axC"></b></span><span class="hmi-motor__v"><i>Voltaje</i><b data-r="axU"></b></span><span class="hmi-motor__v"><i>Temperatura</i><b data-r="axK"></b></span></div>' +
      '<div><div class="hmi-meter mon-meter" data-r="axCar" role="img"><i></i></div><div class="mon-esc"><span>0</span><span>carga · % en valor absoluto</span><span>100</span></div></div></div>' +
      '<p class="hmi-nota" style="margin:var(--space-3) 0 0">La carga es un indicador estimado del actuador; no es fuerza medida en newtons. El límite de temperatura lo fija la ficha del AX-18A.</p></section>'); refs(zax);

    var zm = h('<section class="hmi-panel mon-z-m" aria-label="Motores M1 a M6"><div class="hmi-panel__head"><h2 class="hmi-label">Motores M1 – M6 · encoders y corriente</h2><span class="hmi-nota" data-r="mEsc"></span></div><div class="mon-m6" data-r="m6"></div></section>'); refs(zm);
    var tarj = M.map(function (i) { var t = TarjetaM(i); R.m6.appendChild(t.el); return t; });

    var z4 = h('<div class="hmi-z4"><section class="hmi-panel" aria-label="Avisos"><div class="hmi-panel__head"><h2 class="hmi-label">Avisos</h2><span class="hmi-nota" data-r="alTxt"></span></div><div class="hmi-alarmas" role="table" data-r="al"></div></section>' +
      '<section class="hmi-panel" aria-label="Alcance"><div class="hmi-panel__head"><h2 class="hmi-label">Alcance del monitor</h2></div><ul class="mon-lista"><li>Solo lectura: no envía comandos a los actuadores.</li><li>Los avisos son informativos; no son una función de parada de seguridad.</li><li>Los valores instantáneos se ocultan si la última muestra tiene más de 5 s.</li><li>±0,5 mm es un objetivo por validar con medición física.</li></ul></section></div>'); refs(z4);
    var AVISOS = [
      { id: 'bloqueo', nombre: 'Motor bloqueado', cond: 'El controlador reporta algún motor bloqueado', campo: 'motor_blocked' },
      { id: 'com', nombre: 'Error de comunicación', cond: 'El ESP32 reporta fallo de comunicación', campo: 'communication_error' },
      { id: 'sobre', nombre: 'Sobrecorriente', cond: 'Umbral definido por el hardware', campo: 'overcurrent_alarm' },
      { id: 'fuera', nombre: 'Apertura fuera de referencia', cond: 'Apertura fuera de 0 – 85 mm', campo: 'opening_out_of_range' },
      { id: 'obsoleta', nombre: 'Muestra obsoleta', cond: 'Más de 5 s sin medición nueva' }
    ];
    var estAv = {};
    AVISOS.forEach(function (a) { estAv[a.id] = { rec: false, hora: null }; a.fila = G.FilaAlarma({ nombre: a.nombre, condicion: a.cond, onReconocer: function () { estAv[a.id].rec = true; pinta(); } }); R.al.appendChild(a.fila.el); });

    var z5 = h('<div class="hmi-z5"><details class="hmi-panel hmi-vars"><summary><span class="hmi-label">Contrato de telemetría v1 · ' + CONTRATO.length + ' datos</span><span class="hmi-tag" data-r="conDato"></span></summary><div class="hmi-vars__scroll"><table class="hmi-tabla"><thead><tr><th>Dato</th><th>Campo JSON</th><th>Unidad</th><th>Origen</th><th>Valor actual</th></tr></thead><tbody>' +
      CONTRATO.map(function (c) { return '<tr><td>' + esc(c[0]) + '</td><td class="n">' + esc(c[1]) + '</td><td class="n">' + esc(c[2]) + '</td><td>' + esc(c[3]) + '</td><td class="n"></td></tr>'; }).join('') + '</tbody></table></div></details></div>'); refs(z5);
    var celdas = z5.querySelectorAll('tbody td:last-child');

    var grid = h('<main class="hmi-grid"></main>'), c1 = h('<div class="hmi-col"></div>'), c2 = h('<div class="hmi-col"></div>'), c3 = h('<div class="hmi-col"></div>');
    c1.appendChild(z1); c2.appendChild(zg); c2.appendChild(zt); c3.appendChild(zax);
    [c1, c2, c3, zm, z4, z5].forEach(function (n) { grid.appendChild(n); });
    [bar, banner, herr, aviso, grid].forEach(function (n) { root.appendChild(n); });

    var modelo = { enlace: 'espera', muestras: [], ahora: Date.now() }, historias = {};
    function binario(ind, v, on, off, alerta) { ind.update(v == null ? { estado: 'off', texto: 'Sin datos' } : { estado: v ? (alerta ? 'aviso' : 'on') : 'off', texto: v ? on : off }); }

    function pinta() {
      var ms = modelo.muestras, disp = ms.filter(function (s) { return s.source === origen; }).map(function (s) { return s.device_id; });
      if (disp.indexOf(dispositivo) < 0) disp.unshift(dispositivo);
      var firma = disp.join('|'); if (sel.dataset.f !== firma) { sel.dataset.f = firma; sel.innerHTML = disp.map(function (d) { return '<option>' + esc(d) + '</option>'; }).join(''); } sel.value = dispositivo;
      var clave = dispositivo + ':' + origen, s = ms.filter(function (x) { return x.device_id === dispositivo && x.source === origen; })[0] || null;
      var edad = s ? Math.max(0, (modelo.ahora - s.received_at_ms) / 1000) : null, caduca = edad != null && edad > CADUCA_S, vivo = !!s && !caduca && modelo.enlace !== 'error';
      var f = vivo ? (s.fields || {}) : null, hist = historias[clave] || [];
      function v(k) { return f && f[k] != null ? f[k] : null; }

      var est = f ? COD_ESTADO[f.gripper_state] : null, enFalla = est === 'fault';
      pasos.forEach(function (c, i) { c.update({ estado: !enFalla && PASOS[i][0] === est ? 'activo' : 'pendiente', progreso: 0, duracion: '' }); });
      pFalla.update({ estado: enFalla ? 'falla' : 'pendiente', duracion: enFalla ? 'reportada' : est == null ? 'sin estado' : 'sin falla' });
      iEnlace.update(modelo.enlace === 'ok' ? { estado: 'on', texto: 'Conectado' } : modelo.enlace === 'error' ? { estado: 'falla', texto: 'Sin conexión' } : { estado: 'off', texto: 'Conectando' });
      iMuestra.update(!s ? { estado: 'off', texto: 'Sin muestras' } : caduca ? { estado: 'aviso', texto: 'Obsoleta · ' + fmt(edad, 0) + ' s' } : { estado: 'on', texto: 'Hace ' + fmt(edad, 1) + ' s' });
      iOrigen.update({ estado: origen === 'real' ? 'on' : 'off', texto: ORIGENES[origen] });
      R.sub.textContent = dispositivo + ' · monitor';
      var activos = AVISOS.filter(function (a) { return a.campo && v(a.campo) === 1; }).map(function (a) { return a.nombre.toLowerCase(); });
      banner.hidden = !enFalla; if (enFalla) banner.querySelector('span').textContent = 'El controlador reporta estado de falla' + (activos.length ? ': ' + activos.join(', ') + '.' : '.') + ' Este panel solo informa; la parada la hace el controlador.';

      var txt = '', boton = false;
      if (modelo.enlace === 'error') txt = 'Sin conexión con Node-RED en ' + API + '. Comprueba que el stack esté levantado con: python scripts/manage.py estado';
      else if (modelo.enlace === 'ok' && !s) { boton = origen === 'real' && ms.some(function (x) { return x.source === 'simulated'; }); txt = 'No hay muestras de origen ' + ORIGENES[origen].toLowerCase() + ' para ' + dispositivo + '.' + (boton ? ' El simulador publica con origen simulado.' : ' Conecta el ESP32 o levanta la demo con: python scripts/manage.py demo'); }
      else if (caduca) txt = 'La última muestra llegó hace ' + fmt(edad, 0) + ' s. Los valores instantáneos se ocultan después de 5 s; el histórico sigue en Grafana.';
      aviso.hidden = !txt; aviso.querySelector('span').textContent = txt; aviso.querySelector('button').hidden = !boton;

      pAp.update({ sp: v('opening_target_mm'), pv: v('opening_mm') }); pF.update({ sp: v('force_limit_n'), pv: v('grip_force_n') });
      var vel = v('opening_speed_mm_s'); lectura(R.vel, vel, 1, 'mm/s'); R.velTxt.textContent = vel == null ? '' : vel > 0.05 ? 'abriendo' : vel < -0.05 ? 'cerrando' : 'en reposo';
      lectura(R.ciclo, v('cycle_time_s'), 1, 's');
      R.mDev.textContent = s ? s.device_id : '—'; R.mBoot.textContent = s ? s.boot_id : '—'; R.mSeq.textContent = s ? fmt(s.seq, 0) : '—';
      R.mCal.textContent = s ? (s.calibration_id === 'not-provided' ? 'No informada' : s.calibration_id) : '—'; R.mEdad.textContent = edad == null ? '—' : fmt(edad, 1) + ' s';

      var ap = v('opening_mm'), obj = v('opening_target_mm'), apD = clamp(ap == null ? 85 : ap, 0, 85);
      var mcp = clamp(Math.asin(clamp((34.6 - apD / 2) / 45.2, -1, 1)) * 180 / Math.PI + 10, 0, 60);
      esq.update({ mcp: mcp, pip: { A: 0, B: 0, C: 0 }, falla: null, tamPieza: 0, pieza: false, apertura: apD }, { apertura: clamp(obj == null ? apD : obj, 0, 85), agarre: 'power' });
      esq.el.classList.toggle('mon-apagado', ap == null); esq.el.querySelector('[data-r=tAp]').textContent = ap == null ? 'Sin datos' : fmt(ap, 1) + ' mm';
      Array.prototype.forEach.call(esq.el.querySelectorAll('.obj'), function (l) { l.style.display = obj == null ? 'none' : ''; });
      lectura(R.ap, ap, 1, 'mm'); lectura(R.f, v('grip_force_n'), 1, 'N');
      R.estTxt.textContent = est == null ? 'Estado sin datos' : enFalla ? 'Falla' : PASOS.filter(function (p) { return p[0] === est; })[0][1];
      binario(bObj, v('object_detected'), 'Sí', 'No'); binario(bLa, v('limit_open'), 'On', 'Off'); binario(bLc, v('limit_closed'), 'On', 'Off');
      var fr = v('opening_out_of_range'); bFr.update(fr == null ? { estado: 'off', texto: 'Sin datos' } : fr ? { estado: 'aviso', texto: 'Fuera' } : { estado: 'on', texto: 'Dentro' });
      tr.update(hist, modelo.ahora, vivo);

      lectura(R.axT, v('ax_position_ticks'), 0, 'ticks'); lectura(R.axG, v('ax_position_deg'), 1, '°'); lectura(R.axV, v('ax_speed_rpm'), 1, 'rpm');
      lectura(R.axC, v('ax_load_pct'), 0, '%'); lectura(R.axU, v('ax_voltage_v'), 1, 'V'); lectura(R.axK, v('ax_temperature_c'), 1, '°C');
      var tk = v('ax_position_ticks'), cg = v('ax_load_pct');
      R.axPos.style.setProperty('--pv', (tk == null ? 0 : clamp(tk / 1023, 0, 1) * 100) + '%'); R.axPos.setAttribute('aria-label', 'Posición ' + (tk == null ? 'sin datos' : fmt(tk, 0) + ' de 1023 ticks'));
      R.axCar.style.setProperty('--pv', (cg == null ? 0 : clamp(Math.abs(cg) / 100, 0, 1) * 100) + '%'); R.axCar.setAttribute('aria-label', 'Carga ' + (cg == null ? 'sin datos' : fmt(cg, 0) + ' %'));

      var kI = M.map(function (i) { return 'mi' + i; }), kR = M.map(function (i) { return 'mr' + i; });
      var esc_ = { i: bonito(Math.max(extremo(hist, kI), 0.05) * 1.1), r: bonito(Math.max(extremo(hist, kR), 5) * 1.1), rNeg: hayNegativo(hist, kR) };
      R.mEsc.textContent = 'escala común · 0 – ' + fmt(esc_.i, decDe(esc_.i)) + ' A · ' + (esc_.rNeg ? '±' : '0 – ') + fmt(esc_.r, 0) + ' rpm · último minuto';
      tarj.forEach(function (t) { t.update(f, hist, modelo.ahora - VENTANA_MS, esc_); });

      var nAct = 0;
      AVISOS.forEach(function (a) {
        var e = estAv[a.id], val = a.id === 'obsoleta' ? (s ? (caduca ? 1 : 0) : null) : v(a.campo), activo = val === 1;
        if (activo && !e.hora) e.hora = hora(new Date()); if (!activo) { e.rec = false; e.hora = null; } if (activo) nAct++;
        var valor = '—';
        if (a.id === 'bloqueo' && f) { var bl = M.filter(function (i) { return f['m' + i + '_blocked'] === 1; }); valor = bl.length ? bl.map(function (i) { return 'M' + i; }).join(', ') : 'Ningún motor'; }
        if (a.id === 'sobre' && f) { var mx = Math.max.apply(null, M.map(function (i) { return f['m' + i + '_current_a'] == null ? -1 : f['m' + i + '_current_a']; })); valor = mx < 0 ? '—' : 'máx. ' + fmt(mx, 3) + ' A'; }
        if (a.id === 'fuera' && ap != null) valor = fmt(ap, 1) + ' mm';
        if (a.id === 'obsoleta' && edad != null) valor = fmt(edad, 1) + ' s';
        a.fila.update({ estado: activo ? (e.rec ? 'reconocida' : 'activa') : 'normal', valor: valor, hora: e.hora });
        if (val == null) a.fila.el.querySelector('.hmi-alarma__estado').textContent = 'Sin datos';
      });
      R.alTxt.textContent = nAct ? nAct + (nAct === 1 ? ' aviso activo' : ' avisos activos') : vivo ? 'Sin avisos activos' : 'Sin datos recientes';

      var con = 0; CONTRATO.forEach(function (c, i) { var t = f ? c[4](f) : null; if (t != null) con++; celdas[i].innerHTML = t == null ? ND : esc(t); });
      R.conDato.textContent = con + ' con dato ahora';
    }

    var fuente = crearFuente();
    fuente.on(function (m, hs) { modelo = m; historias = hs; pinta(); });
    pinta(); fuente.start();
    return { el: root };
  }

  window.GripperMonitor = { Monitor: Monitor };
})();
</script>
