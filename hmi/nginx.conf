server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;
    set $node_red http://node-red:1880;

    location = /api/status {
        proxy_pass $node_red;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store";
    }

    location = /api/health {
        proxy_pass $node_red;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        return 404;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
