services:
  hmi:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${DASHBOARD_BIND_IP:-0.0.0.0}:${HMI_PORT:-8080}:80"
    volumes:
      - ./hmi/index.html:/usr/share/nginx/html/index.html:ro
      - ./hmi/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      node-red:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 12
